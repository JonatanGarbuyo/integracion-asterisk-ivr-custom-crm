; Afiliados CRM — ejemplo de configuracion (sin secretos ni URL real).
; Copiar a /etc/asterisk/afiliados-crm.conf con root:asterisk 0640.
; Contrato CRM provisional: pedir URL/auth/samples GET/POST/errores reales
; antes de afirmar CRM real o aceptar en PBX. No inventar contrato definitivo.
;
;   sudo install -o root -g asterisk -m 0640 config.example.conf /etc/asterisk/afiliados-crm.conf
;   Luego editar base_url/api_token con valores de laboratorio (mock) o proveedor.
;   No versionar el archivo real con secretos.

[lookup]
; Base provisional de laboratorio. Ejemplo loopback apagado por defecto.
; En produccion usar https del proveedor con TLS verificado.
base_url = http://127.0.0.1:8899
lookup_path = /afiliado?cuil={CUIL}
; Timeouts: conexion 1s / total 2s por defecto para no retener la llamada.
connect_timeout_s = 1
total_timeout_s = 2
; Limite de cuerpo JSON para GET.
max_bytes = 8192
; TLS verificado y redirects restringidos por defecto.
verify_tls = 1
max_redirects = 0
; Loopback solo con opcion de laboratorio = 1 (mock local). Produccion = 0.
allow_loopback = 0
; Paths JSON simples configurables (primer nivel del objeto).
id_field = id
obra_field = obra_social

[atencion]
; POST setAtencion: base de [lookup] + este path.
post_path = /atencion
connect_timeout_s = 1
total_timeout_s = 2
max_bytes = 8192
verify_tls = 1
max_redirects = 0
allow_loopback = 0
; Credencial de escritura: completar solo en /etc/asterisk/afiliados-crm.conf.
api_token =
; Rutas de instalacion (ver README). No apuntar a /tmp en produccion.
spool_dir = /var/spool/asterisk/afiliados-crm
worker_php = /var/lib/asterisk/agi-bin/afiliados-crm/crm_worker.php
attendant_script = crm_set_atencion.agi.php

[agents]
; Mapeo explicito interfaz -> id de agente CRM. Solo interfaces verificadas.
; Clave: MEMBERINTERFACE base (sin sufijo de canal). Valor: id CRM del operador.
;SIP/101 = agente_demo_101
;Local/101@from-queue/n = agente_demo_101
;Agent/9000 = agente_demo_ana

[extensions]
; Mapeo explicito para SIP/Local -> interno real. Agent/* NO va aqui:
; se resuelve por AGENT(id:fullchannel) en Asterisk 11 para el interno real,
; diferente del id de agente (9000 no es el telefono).
;SIP/101 = 101
;Local/101@from-queue/n = 101
