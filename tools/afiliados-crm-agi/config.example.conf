; Copiar una sola vez a /etc/asterisk/afiliados-crm.conf (root:asterisk 0640).
; No sobrescribir la configuración ni guardar claves reales en Git.
[atenciones]
base_url = "https://servidor-de-testing.example/Atenciones"
api_key = ""
; Opcional: CA privada aceptada por el proveedor. Siempre se verifica TLS/hostname.
ca_file = ""
; Sólo para el mock HTTP local: base_url=http://127.0.0.1:8899/Atenciones
allow_http_loopback = 0

[runtime]
; Variable de captura de Dynamic Routes. Se limpia después de leerla.
cuil_variable = "dtmfinput"
; Directorio privado asterisk:asterisk 0700. Jobs de un uso, sin reintentos.
spool_dir = "/var/spool/asterisk/afiliados-crm"
