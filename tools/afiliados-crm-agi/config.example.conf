; Copiar a /etc/asterisk/afiliados-crm.conf (root:asterisk 0640).
; Completar localmente; no guardar claves reales en Git.
[atenciones]
base_url = "https://testing.ospaca.com/Atenciones"
api_key = ""
; Sólo si se necesita una CA privada:
; ca_file = "/ruta/ca.pem"

[identification]
; Ingresos de CUIL totales, incluido el primero. Tiempos en segundos (1..999).
max_attempts = 3
; Preguntas de confirmacion por cada CUIL, incluida la primera.
; Una tecla invalida o silencio repite solo la pregunta; 2 pide un CUIL nuevo.
max_confirmation_attempts = 3
input_timeout = 5
confirmation_timeout = 5
; Relativos a /var/lib/asterisk/sounds/, sin extension.
request_audio = "custom/atenciones/ingrese-cuil"
entered_audio = "custom/atenciones/usted-ingreso"
confirm_audio = "custom/atenciones/confirme-cuil"
; Se agrega cada digito (0..9) a este prefijo; no usa voces del sistema.
digit_audio_prefix = "custom/atenciones/digito-"
