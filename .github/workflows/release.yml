name: Publish CallFlow Hooks RPM
on:
  push:
    tags: ['v*']
    branches: ['release/callflow-hooks-v*']
permissions:
  contents: write
jobs:
  release:
    concurrency: callflow-hooks-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '5.4'
          extensions: openssl
          coverage: none
      - name: Test and build pinned release
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          CFH_TAG="v$(python3 -c 'import json; print(json.load(open("packaging/version.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "$CFH_TAG" || test "$GITHUB_REF_NAME" = "release/callflow-hooks-$CFH_TAG"
          echo "CFH_TAG=$CFH_TAG" >> "$GITHUB_ENV"
          sudo --preserve-env=PATH python3 -m unittest discover -s tests -v
          python3 tools/build-rpm.py
      - name: Publish versioned package and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$CFH_TAG" dist/rpm/*.rpm dist/rpm/manifest.json \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "CallFlow Hooks $CFH_TAG — laboratorio" \
            --notes-file packaging/release-notes.md
